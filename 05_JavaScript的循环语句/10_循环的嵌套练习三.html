<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      for (var i = 0; i < 9; i++) {
        document.write("<div>");
        for (var j = 0; j < i + 1; j++) {
          document.write(`${j + 1}×${i + 1}=${(i + 1) * (j + 1)} `);
        }
        document.write("</div>");
      }
    </script>
  </body>
</html>
