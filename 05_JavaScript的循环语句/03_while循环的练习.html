      // 5.练习四：计算0~99的偶数和
      var count = 0;
      var totalCount = 0;
      while (count < 100) {
        if (count % 2 === 0) {
          totalCount += count;
        }
        count++;
      }
      console.log("所有的偶数和:", totalCount);

      // 算法优化
      var count = 0;
      var totalCount = 0;
      while (count < 100) {

        count += 2;
