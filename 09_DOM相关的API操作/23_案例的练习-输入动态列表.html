<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>动态创建列表</h1>
    <ul class="list"></ul>
    <script>
      var ulEl = document.querySelector(".list");

      var isFlag = true;
      while (isFlag) {
        var message = prompt("请输入信息：");
        if (!message) {
          //没有输入内容
          isFlag = false;
        } else {
          var lisEl = document.createElement("li");
          lisEl.textContent = message;
          ulEl.append(lisEl);
        }
      }
    </script>
  </body>
</html>
