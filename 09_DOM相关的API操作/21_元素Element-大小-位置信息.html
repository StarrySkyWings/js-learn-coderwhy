<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        padding: 100px;
      }
      .box {
        width: 100px;
        height: 100px;
        padding: 20px;
        border: 10px solid red;
        /* box-sizing: border-box; */
        background-color: orange;

        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="box">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Minus, non
      nesciunt itaque quaerat perferendis cupiditate molestias, illum esse quae
      eius ducimus doloremque similique recusandae nihil nulla odio dolorem
      dolore sint.
    </div>

    <script>
      var boxEl = document.querySelector(".box");

      // 1.获取样式(局限性很强)
      // var boxStyle = getComputedStyle(boxEl);
      // console.log(boxStyle.width, boxStyle.height);

      // 2.获取更多信息
      console.log(boxEl.clientWidth)
      console.log(boxEl.clientHeight)

      console.log(boxEl.clientLeft)
      console.log(boxEl.clientTop)

      console.log(boxEl.offsetWidth)
      console.log(boxEl.offsetHeight)

      console.log(boxEl.offsetLeft)
      console.log(boxEl.offsetTop)

      console.log(boxEl.scrollHeight)
      console.log(boxEl.scrollTop)

      // window对象
      window.onclick = function() {
        console.log(boxEl.scrollTop)
      }
    </script>
  </body>
</html>
