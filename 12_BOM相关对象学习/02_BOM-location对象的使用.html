<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button>打开新的网页</button>
  <button>替换新的网页</button>
  <button>网页重新加载</button>
  <script>
    // 1.完整的URL
    console.log(location.href)
    // 2.获取URL信息
    console.log(location.hostname)
    console.log(location.host)
    console.log(location.protocol)
    console.log(location.port)
    console.log(location.pathname)
    console.log(location.search)
    console.log(location.hash)

    // 3.location方法
    var btns = document.querySelectorAll('button')
    btns[0].onclick = function() {
      location.assign('http://www.baidu.com')
    }
    btns[1].onclick = function() {
      location.replace('http://www.baidu.com')
    }
    btns[2].onclick = function() {
      location.reload()
    }

    // 4.URLSearchParams
    var urlSearchString = '?name=why&age=18&height=1.88'
    var serachParams = new URLSearchParams(urlSearchString)
    console.log(serachParams.get('name'))
    console.log(serachParams.get('age'))
    console.log(serachParams.get('height'))

    serachParams.append('address','广州市')
    console.log(serachParams.get('address'))
    console.log(serachParams.toString())
  </script>
</body>
</html>
