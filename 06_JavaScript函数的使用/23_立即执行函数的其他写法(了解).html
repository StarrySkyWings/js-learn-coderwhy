<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <script>

    // 1.常见的写法
    // (function(){
    //   console.log('立即执行函数被调用~')
    // })()

    // 2.错误的写法
    // () -> 优先级的()
    // function foo(){
    // }()

    // 3.其他写法
    // 匿名函数
    (function(){
      console.log('立即执行函数被调用')
    }())

    // +(正号)-(负号)!(取反) - 了解
    +function foo(){
      console.log('立即执行函数被调用')
    }()
  </script>
</body>
</html>
